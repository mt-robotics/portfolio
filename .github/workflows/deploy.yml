name: Deploy Portfolio

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject chatbot widget URL and key
        run: |
          sed -i 's|__CHATBOT_WIDGET_URL__|${{ secrets.CHATBOT_WIDGET_URL }}|g' index.html
          sed -i 's|__CHATBOT_WIDGET_KEY__|${{ secrets.CHATBOT_WIDGET_KEY }}|g' index.html
          if grep -q '__CHATBOT_WIDGET_' index.html; then echo 'Unfilled widget placeholder' >&2; exit 1; fi

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - uses: actions/deploy-pages@v4
        id: deployment
